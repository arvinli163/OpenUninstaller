name: Build Windows packages

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OpenUninstaller.sln

      - name: Publish portable version
        shell: pwsh
        run: |
          dotnet publish src/OpenUninstaller/OpenUninstaller.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output artifacts/portable

      - name: Publish installer payload
        shell: pwsh
        run: |
          dotnet publish src/OpenUninstaller/OpenUninstaller.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output artifacts/installer

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "artifacts/portable/*" `
            -DestinationPath "artifacts/OpenUninstaller-portable-win-x64.zip" `
            -Force

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build setup EXE
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }
          & $iscc "installer\OpenUninstaller.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenUninstaller-Windows-x64
          path: |
            artifacts/OpenUninstaller-portable-win-x64.zip
            artifacts/portable/OpenUninstaller.exe
            artifacts/setup/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/OpenUninstaller-portable-win-x64.zip
            artifacts/setup/*.exe
